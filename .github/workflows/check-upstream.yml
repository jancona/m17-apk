name: Check upstream versions

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write   # the build result on the pull request
  actions: write    # cancel the pull request's own build run

env:
  ALPINE_VERSION: "3.23"
  BRANCH: upstream-updates

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Check upstream
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_FILE=changed.txt sh scripts/check-upstream.sh report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
          echo "changed=$(cat changed.txt)" >> "$GITHUB_OUTPUT"
          if grep -q '^## Needs attention' report.md; then
            echo "::warning::Some packages need a manual update; see the job summary"
          fi

      - name: Update checksums
        if: steps.check.outputs.changed != ''
        run: sh scripts/update-checksums.sh ${{ steps.check.outputs.changed }}

      # Pull requests opened with GITHUB_TOKEN don't start other workflows,
      # so build and test here, before opening one
      - name: Build (throwaway key)
        if: steps.check.outputs.changed != ''
        run: sh scripts/build-in-docker.sh out

      - name: Install test
        if: steps.check.outputs.changed != ''
        run: sh scripts/install-test.sh out

      - name: Open or update the pull request
        if: steps.check.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat report.md
            echo
            echo "---"
            echo "Built and test-installed by the [Check upstream versions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo "Review the checksum changes: they are where the new sources are trusted."
            echo "Merging publishes the packages."
          } > pr-body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add packages
          { echo "Upstream updates: ${{ steps.check.outputs.changed }}"; echo; cat report.md; } > commit-msg.txt
          git commit -q -F commit-msg.txt
          git push -f origin "$BRANCH"
          pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Upstream updates: ${{ steps.check.outputs.changed }}" --body-file pr-body.md
            echo "Updated pull request #$pr"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Upstream updates: ${{ steps.check.outputs.changed }}" --body-file pr-body.md
          fi

      # GitHub holds the build run of a pull request opened by this bot
      # until someone approves it, and fails it when the pull request is
      # merged first. This run has already built and test-installed the
      # packages: show that on the pull request, and cancel the held run.
      - name: Report the build on the pull request
        if: steps.check.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context="Build and install test" \
            -f description="Built and test-installed before the pull request was opened" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          ids=""
          for i in $(seq 12); do
            ids=$(gh run list --workflow build.yml --branch "$BRANCH" --event pull_request \
              --status action_required --json databaseId -q '.[].databaseId')
            [ -n "$ids" ] && break
            sleep 5
          done
          for id in $ids; do
            gh run cancel "$id" && echo "Cancelled the held build run $id" ||
              echo "::warning::Couldn't cancel the held build run $id"
          done
