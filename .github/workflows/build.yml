name: Build packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  ALPINE_VERSION: "3.23"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      # Pull requests and branches build with a throwaway key, as a check.
      # main is signed with the repository key and published.
      - name: Build
        env:
          ABUILD_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ABUILD_PRIVATE_KEY || '' }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ] && [ -z "$ABUILD_PRIVATE_KEY" ]; then
            echo "::error::The ABUILD_PRIVATE_KEY secret is not set, so main can't be signed and published"
            exit 1
          fi
          mkdir -p out
          docker run --rm -v "$PWD":/repo:ro -v "$PWD/out":/out \
            ${ABUILD_PRIVATE_KEY:+-e ABUILD_PRIVATE_KEY} \
            "alpine:$ALPINE_VERSION" sh /repo/scripts/build.sh /out

      - name: Install test
        run: sh scripts/install-test.sh out

      - name: Arrange the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p site/v$ALPINE_VERSION
          sudo cp -r out/m17 site/v$ALPINE_VERSION/
          sudo cp out/*.rsa.pub site/
          cp README.md site/README.md
          sudo chown -R "$(id -u):$(id -g)" site
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
