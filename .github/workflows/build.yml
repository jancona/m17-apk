name: Build packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  ALPINE_VERSION: "3.23"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      # Pull requests and branches build with a throwaway key, as a check.
      # main is signed with the repository key and published.
      - name: Build
        env:
          ABUILD_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ABUILD_PRIVATE_KEY || '' }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ] && [ -z "$ABUILD_PRIVATE_KEY" ]; then
            echo "::error::The ABUILD_PRIVATE_KEY secret is not set, so main can't be signed and published"
            exit 1
          fi
          mkdir -p out
          docker run --rm -v "$PWD":/repo:ro -v "$PWD/out":/out \
            ${ABUILD_PRIVATE_KEY:+-e ABUILD_PRIVATE_KEY} \
            "alpine:$ALPINE_VERSION" sh /repo/scripts/build.sh /out

      - name: Install test
        run: |
          docker run --rm -v "$PWD/out":/repo:ro "alpine:$ALPINE_VERSION" sh -c '
            set -e
            cp /repo/*.rsa.pub /etc/apk/keys/
            echo /repo/m17 >> /etc/apk/repositories
            apk add -q --no-cache rpi-dashboard m17-gateway-openrc m17-firmware-cc1200 \
              m17-firmware-mmdvm m17-firmware-mmdvm-hs m17-sx1255-overlay
            /opt/m17/m17-gateway/m17-gateway -h 2>&1 | grep -q -- -config
            test -f /etc/m17-gateway/m17-gateway.ini
            test -L /etc/m17-gateway.ini
            su -s /bin/sh www-data -c "test -w /etc/m17-gateway.ini && test -w /var/lib/m17-gateway/M17Hosts.txt"
            test -f /boot/firmware/overlays/genericstereoaudiocodec.dtbo
            apk info -v | grep -E "m17|rpi-dashboard" | sort
          '

      - name: Arrange the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p site/v$ALPINE_VERSION
          sudo cp -r out/m17 site/v$ALPINE_VERSION/
          sudo cp out/*.rsa.pub site/
          cp README.md site/README.md
          sudo chown -R "$(id -u):$(id -g)" site
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
